name: Build and Push Docker Images

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        env:
          DOCKER_USER: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASS: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          # Принудительно удаляем все невидимые символы (\r, пробелы) из секретов
          CLEAN_USER=$(echo "$DOCKER_USER" | tr -d '[:space:]')
          CLEAN_PASS=$(echo "$DOCKER_PASS" | tr -d '[:space:]')
          
          # Используем printf вместо echo, чтобы избежать искажения спецсимволов
          printf '%s' "$CLEAN_PASS" | docker login -u "$CLEAN_USER" --password-stdin

      - name: Build and push Order Service
        uses: docker/build-push-action@v5
        with:
          context: ./order_service
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/order-service:latest

      - name: Build and push Restaurant Service
        uses: docker/build-push-action@v5
        with:
          context: ./restaurant_service
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/restaurant-service:latest
