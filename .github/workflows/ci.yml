name: Build and Push Docker Images

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Config
        env:
          DOCKER_USER: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASS: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          mkdir -p ~/.docker
          AUTH=$(echo -n "$DOCKER_USER:$DOCKER_PASS" | base64)
          echo "{\"auths\":{\"https://index.docker.io/v1/\":{\"auth\":\"$AUTH\"}}}" > ~/.docker/config.json

      - name: Build and push Order Service
        uses: docker/build-push-action@v5
        with:
          context: ./order_service
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/order-service:latest

      - name: Build and push Restaurant Service
        uses: docker/build-push-action@v5
        with:
          context: ./restaurant_service
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/restaurant-service:latest
