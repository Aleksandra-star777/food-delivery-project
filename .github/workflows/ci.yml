name: Build and Push Docker Images

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Clean Secrets
        run: |
          # Удаляем невидимые символы (\r, пробелы) из секретов
          CLEAN_USER=$(echo "${{ secrets.DOCKER_USERNAME }}" | tr -d '\r' | xargs)
          CLEAN_PASS=$(echo "${{ secrets.DOCKER_PASSWORD }}" | tr -d '\r' | xargs)
          echo "DH_USER=$CLEAN_USER" >> $GITHUB_ENV
          echo "DH_PASS=$CLEAN_PASS" >> $GITHUB_ENV

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DH_USER }}
          password: ${{ env.DH_PASS }}

      - name: Build and push Order Service
        uses: docker/build-push-action@v5
        with:
          context: ./order_service
          push: true
          tags: ${{ env.DH_USER }}/order-service:latest

      - name: Build and push Restaurant Service
        uses: docker/build-push-action@v5
        with:
          context: ./restaurant_service
          push: true
          tags: ${{ env.DH_USER }}/restaurant-service:latest
