name: Build and Push Docker Images

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        env:
          DH_USER: ${{ secrets.DOCKER_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKER_PASSWORD }}
        run: printf '%s' "$DH_TOKEN" | docker login docker.io -u "$DH_USER" --password-stdin

      - name: Build and push Order Service
        uses: docker/build-push-action@v5
        with:
          context: ./order_service
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/order-service:latest

      - name: Build and push Restaurant Service
        uses: docker/build-push-action@v5
        with:
          context: ./restaurant_service
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/restaurant-service:latest
