version: "3.8"

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: food_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - food-net

  redis:
    image: redis:alpine
    networks:
      - food-net

  order-service:
    build: ./order_service
    image: food-order-service:latest
    environment:
      - REDIS_HOST=redis
    depends_on:
      - redis
    networks:
      - food-net

  restaurant-service:
    build: ./restaurant_service
    image: food-restaurant-service:latest
    depends_on:
      - db
    networks:
      - food-net

  gateway:
    image: nginx:alpine
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - order-service
      - restaurant-service
    networks:
      - food-net

  frontend:
    image: nginx:alpine
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on:
      - gateway
    networks:
      - food-net

networks:
  food-net:
    driver: overlay

volumes:
  pgdata: